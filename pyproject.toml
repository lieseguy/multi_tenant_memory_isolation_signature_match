[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lieseguy-multi_tenant_memory_isolation_signature_match"
version = "0.1.0"
description = "通过字符级与结构级特征识别AIGC 内容生成工程师·多租户的显存隔离的痕迹，给出密度与命中位置"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "lieseguy" }]
keywords = ["llm", "cli", "analysis", "observability"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Utilities",
]

[project.urls]
Homepage = "https://lieseguy.github.io"
Repository = "https://github.com/lieseguy/multi_tenant_memory_isolation_signature_match"
Issues = "https://github.com/lieseguy/multi_tenant_memory_isolation_signature_match/issues"

[project.scripts]
multi_tenant_memory_isolation_signature_match = "multi_tenant_memory_isolation_signature_match:main"

[tool.setuptools]
py-modules = ["multi_tenant_memory_isolation_signature_match"]
